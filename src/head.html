<title>Тренажёр биоинформатики</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: a fixed left rail lists the modules in learning order; one module at a time fills the reading column.
   Haplotypes are the one semantic colour pair (hap1 blue, hap2 orange). Everything else is ink on cool paper. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunken:#E8EDF2;
  --ink:#0F1A24; --ink-2:#364656;
  --line:#C5D0DA; --line-strong:#6A7F92;
  --link:#0A4585;
  --h1:#1B55B8; --h2:#C2500F;
  --h1-text:#153F95; --h2-text:#8A3205;
  --good:#0F5A2E; --warn:#6B4300; --bad:#8A1C20;
  --good-fill:#DDF1E4; --bad-fill:#F8E1E1; --warn-fill:#F6EBD3;
  --sel:#BFD8F4;
  --tok-k:#6A2379; --tok-s:#075A2F; --tok-c:#3F5060; --tok-n:#823700; --tok-f:#0A4585;
  --font:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --measure:68ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#141E28; --sunken:#1B2733;
    --ink:#EAF0F5; --ink-2:#B4C2CF;
    --line:#2C3B4A; --line-strong:#7C90A3;
    --link:#8EC1F5;
    --h1:#7FA9FF; --h2:#FF9C6E;
    --h1-text:#9DBDFF; --h2-text:#FFB08A;
    --good:#6FD39A; --warn:#E8B454; --bad:#FF8A8F;
    --good-fill:#16301F; --bad-fill:#3A1D20; --warn-fill:#33290F;
    --sel:#2B4F78;
    --tok-k:#D9A6EE; --tok-s:#8FDDAA; --tok-c:#9DB0C2; --tok-n:#F0B070; --tok-f:#8EC1F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#141E28; --sunken:#1B2733;
  --ink:#EAF0F5; --ink-2:#B4C2CF;
  --line:#2C3B4A; --line-strong:#7C90A3;
  --link:#8EC1F5;
  --h1:#7FA9FF; --h2:#FF9C6E;
  --h1-text:#9DBDFF; --h2-text:#FFB08A;
  --good:#6FD39A; --warn:#E8B454; --bad:#FF8A8F;
  --good-fill:#16301F; --bad-fill:#3A1D20; --warn-fill:#33290F;
  --sel:#2B4F78;
  --tok-k:#D9A6EE; --tok-s:#8FDDAA; --tok-c:#9DB0C2; --tok-n:#F0B070; --tok-f:#8EC1F5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:1.0625rem; line-height:1.62; font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; margin:0; -webkit-text-size-adjust:100%;
}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:3px}
a{color:var(--link);text-underline-offset:.2em;text-decoration-thickness:1.5px}
a:hover{text-decoration-thickness:3px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,4.4vw,2.7rem);font-weight:700;letter-spacing:-.012em}
h2{font-size:1.6rem;font-weight:700;margin-top:3rem;margin-bottom:.8rem;letter-spacing:-.006em}
h3{font-size:1.2rem;font-weight:700;margin-top:1.8rem;margin-bottom:.5rem}
p{margin:0 0 1rem;max-width:var(--measure)}
ul,ol{max-width:var(--measure);padding-left:1.3rem;margin:0 0 1rem}
li{margin-bottom:.35rem}
strong{font-weight:700}
small{font-size:1rem}
code,kbd{font-family:var(--mono);font-size:1rem;background:var(--sunken);padding:.05em .35em;border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--sunken)}
.scroll-x{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px}
.scroll-x table{min-width:560px}
.hap1{color:var(--h1-text);font-weight:600}
.hap2{color:var(--h2-text);font-weight:600}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.05em}
.sw.h1{background:var(--h1)} .sw.h2{background:var(--h2)}

/* shell */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:0 48px;max-width:1280px;margin:0 auto}
.rail{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;padding:28px 0 28px;display:flex;flex-direction:column;gap:20px}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.3;text-decoration:none;color:var(--ink);display:block}
.brand small{display:block;font-weight:400;font-size:1rem;color:var(--ink-2);margin-top:.25rem;letter-spacing:0}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-width:none}
.mods li{margin:0}
.mods a{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;text-decoration:none;color:var(--ink);min-height:44px}
.mods a:hover{background:var(--sunken)}
.mods a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.mods svg{width:20px;height:20px}
.mods .ring{stroke:currentColor;fill:none;stroke-width:2}
.mods .done .ring{fill:currentColor}
.mods .tick{stroke:var(--bg);fill:none;stroke-width:2.4;opacity:0}
.mods .done .tick{opacity:1}
.mods a[aria-current="page"].done .tick{stroke:var(--ink)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:1rem;color:var(--ink-2)}
.mobile-top{display:none}
main{padding:36px 0 96px;min-width:0}
.view[hidden]{display:none}
.lede{font-size:1.25rem;line-height:1.5;color:var(--ink);max-width:var(--measure);margin-top:.9rem}
.meta{color:var(--ink-2);margin-top:.5rem}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line)}

/* controls */
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:hover,.btn:hover{background:var(--sunken)}
button.primary,.btn.primary{background:var(--ink);color:var(--bg)}
button.primary:hover,.btn.primary:hover{background:var(--ink-2)}
button[disabled]{opacity:.55;cursor:not-allowed}
button.chip{min-height:44px;font-weight:500}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=number],textarea,select{font:inherit;font-family:var(--mono);color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:9px 12px;min-height:44px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--link);min-height:44px}
label{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:.7rem 0}
.row>label{min-width:0}
.row>label:has(input,select){display:flex;flex-direction:column;gap:4px}
.field-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* widget bench */
.bench{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;margin:1.4rem 0 1.8rem;min-width:0;overflow-x:auto}
.bench>h3{margin-top:0}
.bench .hint{color:var(--ink-2);margin:.2rem 0 .8rem}
.readout{font-family:var(--mono);background:var(--sunken);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:.7rem 0 0}
.stat-row{display:flex;flex-wrap:wrap;gap:8px 28px;margin:.8rem 0 0}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2)}
svg text{font-family:var(--font);fill:var(--ink);font-size:16px}
svg .muted{fill:var(--ink-2)}
svg .axis{stroke:var(--line-strong);stroke-width:1.2}
svg .grid{stroke:var(--line);stroke-width:1}
.chart{width:100%;min-width:760px;height:auto;display:block}
.legend{display:flex;gap:6px 20px;flex-wrap:wrap;margin:.5rem 0}

/* note */
.note{background:var(--sunken);border-radius:6px;padding:14px 16px;margin:1.2rem 0;max-width:var(--measure)}
.note>b:first-child{display:block;margin-bottom:.15rem}
.note.warn{background:var(--warn-fill)}
.note.warn>b:first-child{color:var(--warn)}
.note.ok{background:var(--good-fill)}
.note.ok>b:first-child{color:var(--good)}

/* code */
figure.code{margin:1.2rem 0 1.6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;min-width:0}
figure.code>figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px 6px 14px;background:var(--sunken);font-weight:600}
figure.code figcaption span small{font-weight:400;color:var(--ink-2);margin-left:.5rem}
figure.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:1rem;line-height:1.55;tab-size:4}
figure.code pre code{background:none;padding:0;font-size:inherit}
figure.code details{border-top:1px solid var(--line)}
figure.code summary{padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
figure.code details pre{background:var(--sunken);border-top:1px solid var(--line)}
.k,.kn,.kc,.ow{color:var(--tok-k);font-weight:600}
.s,.s1,.s2,.sa,.sb,.si,.sd,.se{color:var(--tok-s)}
.c,.c1,.cm,.cs,.ch,.cp,.cpf{color:var(--tok-c);font-style:italic}
.m,.mi,.mf,.mh{color:var(--tok-n)}
.nf,.nc,.nb,.fm{color:var(--tok-f)}
.cmd{font-family:var(--mono)}

/* quiz */
.quiz{border-top:2px solid var(--ink);margin-top:3rem;padding-top:1.2rem}
.q{margin:1.4rem 0;max-width:var(--measure)}
.q fieldset{border:0;margin:0;padding:0}
.q legend{font-weight:700;padding:0;margin-bottom:.5rem}
.q label{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:8px 10px;border-radius:6px;cursor:pointer;min-height:44px}
.q label:hover{background:var(--sunken)}
.q input{margin-top:.35rem;accent-color:var(--link);width:20px;height:20px;flex:none}
.q .fb{margin-top:.5rem;padding:10px 12px;border-radius:6px}
.q .fb.ok{background:var(--good-fill)} .q .fb.no{background:var(--bad-fill)}
.q .fb b.ok{color:var(--good)} .q .fb b.no{color:var(--bad)}
.q label.is-right{background:var(--good-fill)} .q label.is-wrong{background:var(--bad-fill)}
.score{font-weight:700}
details.qa{border-bottom:1px solid var(--line);max-width:var(--measure)}
details.qa>summary{cursor:pointer;font-weight:600;padding:12px 0;min-height:44px;display:flex;align-items:center}
details.qa>div{padding:0 0 14px}
details.qa p{margin-bottom:.6rem}

/* sentence decoder */
.sentence{font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.8;max-width:46ch;margin:1.2rem 0}
.sentence button{font:inherit;font-weight:600;min-height:0;padding:0 .18em;border:0;border-bottom:3px solid var(--line-strong);border-radius:0;display:inline;background:transparent;color:var(--ink);cursor:pointer}
.sentence button:hover{background:var(--sunken)}
.sentence button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-bottom-color:var(--ink)}
.decode{min-height:8.5rem;max-width:var(--measure);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.decode b{display:block;margin-bottom:.2rem}

.plan{list-style:none;padding:0;max-width:var(--measure)}
.plan li{display:grid;grid-template-columns:minmax(0,12rem) 1fr;gap:4px 18px;padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.plan a{font-weight:700}

/* tracks */
.legend .sw{margin-right:.4em}
.matrix{border-collapse:collapse;font-family:var(--mono);font-size:1rem;width:auto}
.matrix td,.matrix th{padding:4px 8px;text-align:center;border:1px solid var(--line);min-width:2.4rem;background:var(--surface)}
.matrix th{background:var(--sunken)}
.matrix td.path{background:var(--good-fill);font-weight:700}
.dna{font-family:var(--mono);letter-spacing:.08em;word-break:break-all}
.dna .stop,.prot .stop{color:var(--bad);font-weight:700}
.dna .del{color:var(--bad);text-decoration:line-through}
.prot{font-family:var(--mono);letter-spacing:.08em;word-break:break-all}
.cds{display:inline-block;padding:0 .12em;margin-right:.18em;border-radius:3px;background:var(--sunken)}

@media (max-width:900px){
  .app{display:block}
  .rail{display:none}
  .mobile-top{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .mobile-top select{width:100%;font-family:var(--font);font-weight:600}
  .mobile-top .top-row{display:flex;gap:10px;align-items:center}
  main{padding-top:20px}
  .plan li{grid-template-columns:1fr}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
